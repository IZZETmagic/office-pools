<!DOCTYPE html>
<!--
  SportPool avatar builder — generated by build-builder.py. Do not edit this file directly;
  edit the template and re-run, or your changes are lost on the next build.

  The compose logic below is a PORT OF compose.py. compose.py is the reference; if they
  drift, this page lies about what the product will render.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SportPool avatar builder</title>
<style>
  :root {
    --ink:#16181d; --muted:#6b7280; --line:#e6e8ec; --bg:#f6f7f9; --card:#fff;
    --accent:#2563eb;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:14px; position:sticky; top:0; z-index:5 }
  header h1 { margin:0; font-size:16px; font-weight:650; letter-spacing:-.01em }
  header .sub { color:var(--muted); font-size:12px }
  .wrap { display:grid; grid-template-columns:340px 1fr; gap:20px; padding:20px; align-items:start }
  @media (max-width:900px){ .wrap { grid-template-columns:1fr } }

  .stage { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px;
           position:sticky; top:70px }
  .stage .av { width:100%; aspect-ratio:1; border-radius:14px; overflow:hidden; background:#fff }
  .stage .av svg { width:100%; height:100%; display:block }
  .sizes { display:flex; gap:14px; align-items:flex-end; margin-top:16px; padding-top:14px;
           border-top:1px solid var(--line) }
  .sizes div { border-radius:6px; overflow:hidden; background:#fff }
  .sizes svg { display:block }
  .sizes span { color:var(--muted); font-size:11px; margin-left:auto }

  .panel { display:flex; flex-direction:column; gap:14px }
  .group { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px }
  .group h2 { margin:0 0 10px; font-size:12px; font-weight:650; text-transform:uppercase;
              letter-spacing:.07em; color:var(--muted) }
  .chips { display:flex; flex-wrap:wrap; gap:6px }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 11px;
          font-size:12.5px; cursor:pointer; color:#374151 }
  .chip:hover { border-color:#c7cbd3 }
  .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff }
  .swatches { display:flex; flex-wrap:wrap; gap:7px }
  .sw { width:26px; height:26px; border-radius:50%; border:2px solid #fff; cursor:pointer;
        box-shadow:0 0 0 1px var(--line) }
  .sw[aria-pressed="true"] { box-shadow:0 0 0 2px var(--accent) }
  .row { display:flex; align-items:center; gap:10px; margin-top:8px }
  .row label { font-size:12px; color:var(--muted); min-width:64px }
  input[type=range] { flex:1 }
  .out { background:#0f1115; color:#d7dce5; border-radius:12px; padding:12px 14px; font-size:12px;
         font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre; overflow-x:auto }
  .bar { display:flex; gap:8px; flex-wrap:wrap }
  .btn { border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 13px;
         font-size:13px; cursor:pointer }
  .btn:hover { border-color:#c7cbd3 }
  .btn.primary { background:var(--ink); color:#fff; border-color:var(--ink) }
  .note { color:var(--muted); font-size:11.5px; margin-top:8px }
</style>
</head>
<body>
<header>
  <h1>SportPool avatar builder</h1>
  <span class="sub" id="counts"></span>
</header>

<div class="wrap">
  <div class="stage">
    <div class="av" id="stage"></div>
    <div class="sizes">
      <div id="s96"></div><div id="s56"></div><div id="s32"></div>
      <span>rendered at 96 / 56 / 32px</span>
    </div>
    <div class="bar" style="margin-top:14px">
      <button class="btn primary" id="rand">Randomise</button>
      <button class="btn" id="copySvg">Copy SVG</button>
      <button class="btn" id="copyCfg">Copy config</button>
    </div>
    <div class="out" id="cfg" style="margin-top:12px"></div>
    <div class="note">The config is what a member record stores — about 200 bytes, never an image.</div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<script>
/*__DATA__*/

/* ---- colour helpers: ports of compose.py ------------------------------------------- */
const hex2rgb = h => { h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); };
const rgbStr  = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const darken  = (c,f=0.78) => rgbStr(c.map(v => Math.max(0, Math.trunc(v*f))));
const lighten = (c,f=1.22) => rgbStr(c.map(v => Math.min(255, Math.trunc(v*f))));
/* ⭐⭐ THE MOUTH MUST NOT DISAPPEAR INTO THE SKIN. ΔE said this palette was fine (every pair
   >= 21.9) and ΔE was the wrong measure: a mouth is a THIN LINE and fine detail is resolved by
   LIGHTNESS, not hue. In L* the four mouth colours sit at 48-64 while skin runs 21-91, so
   mid-brown skins landed on top of them — #B7793A skin vs #B67A70 lips is ΔL* 1.0.
   ⭐ Integer luma rather than Lab: verify-avatar-parity.mjs holds this file byte-identical to
   compose.ts and compose.py, and three languages' float cube roots would eventually disagree.
   ⭐⭐ It OFFSETS rather than scales — adding a constant to every channel moves luma by exactly
   that constant, so the separation is guaranteed. 22 of 60 pairs adjust, none clamp. */
const MOUTH_SKIN_FLOOR = 40;
const lumaOf = c => Math.trunc((299*c[0] + 587*c[1] + 114*c[2]) / 1000);
const mouthAgainstSkin = (mouth, skin) => {
  const lm = lumaOf(mouth), ls = lumaOf(skin);
  const d = lm - ls;
  if (Math.abs(d) >= MOUTH_SKIN_FLOOR) return mouth;
  const dir = d > 0 ? 1 : d < 0 ? -1 : (ls > 127 ? -1 : 1);
  const off = ls + dir*MOUTH_SKIN_FLOOR - lm;
  return mouth.map(v => Math.min(255, Math.max(0, v + off)));
};
const mix     = (a,b,t)    => rgbStr(a.map((v,i) => Math.trunc(v + (b[i]-v)*t)));
const lum2 = c => 0.2126*c[0] + 0.7152*c[1] + 0.0722*c[2];
// stubble is a shadow: toward the skin, then toward grey. ⚠ Same numbers as compose.ts/.py.
const STUBBLE_TOWARD_SKIN = 0.83;
const STUBBLE_TOWARD_GREY = 0.55;
// ⚠⚠ ...then a FLOOR against the SKIN. The derivation tracks the hair and says nothing about
// the skin; over all 72 hair x skin combinations 35 landed within 12 luminance of it and 20
// came out lighter. Lighter is not wrong (white hair on dark skin), so the floor is on the
// DISTANCE, and it only bites when they are too close.
const STUBBLE_MIN = 14;
const stubbleTone = (hair, skin) => {
  let m = hair.map((v,i) => v + (skin[i]-v)*STUBBLE_TOWARD_SKIN);
  const grey = lum2(m);
  m = m.map(v => v + (grey-v)*STUBBLE_TOWARD_GREY);
  const d = lum2(m) - lum2(skin);
  if (Math.abs(d) < STUBBLE_MIN) {
    const k = (lum2(skin) + (d > 0 ? STUBBLE_MIN : -STUBBLE_MIN)) - lum2(m);
    m = m.map(v => Math.max(0, Math.min(255, v + k)));
  }
  return rgbStr(m.map(v => Math.trunc(v)));
};

/* ---- tokens, exactly as the assets carry them -------------------------------------- */
const T = {
  hairBase:'rgb(140,122,110)', hairShade:'rgb(114,97,86)', hairLight:'rgb(168,150,138)',
  skin:'rgb(254,205,180)', skinShade:'rgb(245,178,150)',
  shirt:'rgb(30,118,214)', shirt2:'rgb(50,118,183)', bg:'rgb(255,255,255)',
  // ⭐ the third GARMENT tone, LIGHT on purpose — shirt->shirt2 is already the dark step, and
  // the sports top's largest panel is lighter than its body. ⚠ garments only; bases have two.
  shirtLight:'rgb(96,170,240)',
  // ⭐ the chest mark's own tone — the sports top paints panels in the light token, so a mark
  // sharing it would vanish where it crossed one.
  markInk:'rgb(200,225,255)',
  irisCore:'rgb(117,62,21)', irisRim:'rgb(150,84,34)',
  mouthInk:'rgb(182,122,112)', mouthDark:'rgb(118,72,68)', mouthTongue:'rgb(206,116,112)',
  browInk:'rgb(101,70,52)', blush:'rgb(240,158,138)', stubble:'rgb(164,150,140)',
  // ⭐ facial hair is filled from the hair colour LIGHTENED, so a beard does not vanish into
  // long hair. Marked here, filled in the recolour pass. ⚠ off-palette green on purpose.
  beard:'rgb(110,150,126)', fade:'rgb(126,110,150)',
  // ⭐ eyewear: the frame takes the input verbatim, the lens is derived from it.
  frameInk:'rgb(64,70,78)', lensTint:'rgb(96,126,156)',
  // ⭐ the glass highlight. ⚠⚠ it traces as pure white, which is the BACKGROUND token —
  // extract-glasses.py retokenises it or it would vanish on a white background.
  glint:'rgb(226,240,250)',
  // ⭐ earring metal: one flat tone, taken verbatim — the art has no second highlight tone.
  metal:'rgb(212,160,54)',
};
// ⚠⚠ ADDITIVE, not a factor: ×1.14 gave +2.2 luminance on black hair (no separation) and
// clamped platinum to pure white. A constant moves every swatch by the same amount.
const BEARD_LIFT = 12;
/* ⭐ EYEWEAR: two tokens from ONE input, the shape the iris and the mouth already use.
   ⚠ A CLEAR pair has no lens path — the opening is cut out of the frame for real, because
   eyewear composes OVER the eyes and anything opaque there hides them.
   ⚠⚠ A LENS LEANS TOWARD GLASS, it is not the frame lightened. Lightening by a constant
   matches the approved art on a black frame and gives a pale primrose on gold. */
// ⭐ the lens is BLACK, not derived from the frame — a slate tint is photographic, black is
// what sunglasses read as. ⚠⚠ "slightly lighter than black", and the floor is set by the
// DARKEST FRAME: at rgb(38,42,50) it sits 6.6 luminance off rgb(34,38,46) and the frame stops
// reading on a black pair. This keeps 20.
const LENS_BLACK = [52,58,68], DEFAULT_FRAME = '#22262E', DEFAULT_METAL = '#D4A017';
// ⭐⭐ the highlight is TRANSLUCENT (fill-opacity lives in the asset), so it lightens whatever
// is behind it and the derivation that used to fake that is gone. One cool constant.
const GLASS_TINT = [214,234,250];
/* ⭐⭐ A TINTED LENS IS OPAQUE, so nothing behind it is drawn. Ryan, 2026-09-21: "When wearing
   sunglasses, the eyes should not be able to be seen."
   ⚠ Letting the lens cover them is NOT enough — THE EYE IS BIGGER THAN THE LENS. The default
   eye leaks 8.8% of its area past s01-classic and eye-hearts leaks 29.5%.
   ⚠ BROWS ARE NOT IN THIS LIST: they sit at y700..817 against a frame top edge of y715, so
   paint order already hides all but the sliver above the rim. Cheeks and tear tracks likewise.
   ⚠ The eye white shares its token with an open mouth's TEETH — only the expression's UPPER
   half is stripped, and teeth are in the lower one. */
// ⚠⚠⚠ THE BACKGROUND AND THE EYE WHITE ARE THE SAME TOKEN, rgb(255,255,255). swapAll on it
// repaints every eye white — and the teeth, which share that token — with the background
// colour. It always has; it was invisible only because every palette background is a
// near-white tint. A bold colour gives the avatar coloured eyeballs.
// ⭐ Fixed by POSITION: the background is the canvas rect the base paints FIRST, and the only
// path starting at the origin. Both the bases and the eye assets are LOCKED, so tone cannot be
// made to tell them apart. Mirrors compose.py and lib/avatar/compose.ts exactly.
function paintCanvas(svg, colour){
  let done = false;
  return svg.replace(/<path[^>]*\/?>/g, p => {
    if (done || !p.includes('fill="'+T.bg+'"') || !/d="M\s*0[.,\s]+0[\s,]/.test(p)) return p;
    done = true;
    return p.replace('fill="'+T.bg+'"', 'fill="'+colour+'"');
  });
}
const EYE_TOKENS = ['rgb(255,255,255)','rgb(117,62,21)','rgb(150,84,34)','rgb(90,60,45)'];
const stripEyes = frag => frag.replace(/<path[^>]*\/?>/g,
  p => EYE_TOKENS.some(t => p.includes(`fill="${t}"`)) ? '' : p);
// ⚠⚠ stroke as well as fill: every hair path carries a hairline stroke of its own fill (see
// seal-hair-seams.py), holding the same token, so fill-only would leave grey-brown outlines.
const swapAll = (s,find,rep) =>
  s.split(`fill="${find}"`).join(`fill="${rep}"`).split(`stroke="${find}"`).join(`stroke="${rep}"`);

/* ---- find the base's nose, by shape ------------------------------------------------
   The ears share its exact tone and so does the neck shadow, so colour alone cannot do it.
   Narrow, centred, upper-middle is the nose. Same test as compose.py.                   */
function findNose(doc){
  for (const m of doc.matchAll(/<path[^>]*\/?>/g)) {
    const p = m[0];
    if (!p.includes(`fill="${T.skinShade}"`)) continue;
    const d = /d="([^"]*)"/.exec(p); if (!d) continue;
    const n = (d[1].match(/-?\d+\.?\d*/g) || []).map(Number);
    const xs = n.filter((_,i)=>i%2===0), ys = n.filter((_,i)=>i%2===1);
    if (!xs.length) continue;
    const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys);
    if (x1-x0 < 200 && (x0+x1)/2 > 900 && (x0+x1)/2 < 1150 && y0 > 900 && y0 < 1200) return p;
  }
  return null;
}

/* ---- compose: layer first, recolour second -----------------------------------------
   ⚠ These two phases must not interleave. In compose.py they once did, and --eye-colour
   silently did nothing to whole-face expressions because the swap ran before the paths
   it was meant to catch existed.                                                        */
/* ---- the two ears, by position ------------------------------------------------------
   They share the nose's tone and the neck shadow's, so colour cannot separate them: an ear
   is the one OUTBOARD of the head's straight sides. Same test as compose.py.            */
/* the head: the only skin path spanning the canvas. Same test as compose.py. */
function findHead(doc){
  for (const m of doc.matchAll(/<path[^>]*\/?>/g)) {
    const p = m[0];
    if (!p.includes(`fill="${T.skin}"`)) continue;
    const d = /d="([^"]*)"/.exec(p); if (!d) continue;
    const n = (d[1].match(/-?\d+\.?\d*/g) || []).map(Number);
    const xs = n.filter((_,i)=>i%2===0);
    if (xs.length && Math.max(...xs) - Math.min(...xs) > 900) return d[1];
  }
  return null;
}

function findEars(doc){
  const out = [];
  for (const m of doc.matchAll(/<path[^>]*\/?>/g)) {
    const p = m[0];
    if (!p.includes(`fill="${T.skinShade}"`)) continue;
    const d = /d="([^"]*)"/.exec(p); if (!d) continue;
    const n = (d[1].match(/-?\d+\.?\d*/g) || []).map(Number);
    const xs = n.filter((_,i)=>i%2===0); if (!xs.length) continue;
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
    if (cx < 600 || cx > 1448) out.push(p);
  }
  return out;
}

/* ⭐⭐ EVERY ID IN A COMPOSED DOCUMENT IS SUFFIXED — an id is scoped to the DOCUMENT and an
   avatar is one element among many on a page. Two inline avatars and the browser resolves
   every url(#facehole) to the FIRST definition, so avatars 2..n borrow avatar 1's mask and
   the styles that rely wholly on it flood with hair.

   The suffix is a hash of the document ITSELF: deterministic, so a config always composes to
   the same bytes; drift-proof, because all three composers hash the same string; and safe to
   collide, because only identical documents can, and those carry identical masks.
   ⚠ This builder shows ONE avatar, so it does not need the fix — it carries it so the three
   composers do not drift. See lib/avatar/compose.ts for the long form. */
const idHash = s => {
  // FNV-1a, 32-bit, over code units — for ASCII also the bytes, so this matches Python's ord.
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(36) + s.length.toString(36);   // ⚠ the LENGTH rides along
};
// ⚠ (\s)id= and not \bid=, or an attribute merely ENDING in id — data-fade-id — is rewritten.
function uniquifyIds(svg){
  if (!svg.includes('id="')) return svg;
  const uid = idHash(svg);
  return svg
    .replace(/(\s)id="([^"]+)"/g, (_, sp, id) => `${sp}id="${id}--${uid}"`)
    .replace(/url\(#([^)]+)\)/g, (_, id) => `url(#${id}--${uid})`);
}

function compose(c){
  let svg = ASSETS.bases[c.base];
  const add = frag => { svg = svg.replace('</svg>', frag + '</svg>'); };

  const fh = c.facialhair ? ASSETS.facialhair[c.facialhair] : null;
  // ⭐ eyewear sits OVER the eyes and UNDER the hair — a temple arm disappears into hair the
  // way a real one does. See compose.ts for why the nose rule is untouched.
  const glassesLayer = c.glasses ? ((ASSETS.glasses||{})[c.glasses] || '') : '';
  // ⭐ tinted is INFERRED from the asset — a style is tinted exactly when it paints a lens.
  const tinted = glassesLayer.includes(T.lensTint);
  // ⭐⭐ an earring belongs to the EAR, so it is painted WITH the ear — first, before anything
  // that could cover it. If the hair hides the ear it hides the earring, automatically.
  const earringsLayer = c.earrings ? ((ASSETS.earrings||{})[c.earrings] || '') : '';
  const fhOver = !!(c.facialhair && (ASSETS.fhManifest[c.facialhair]||{}).over);

  // THE STACK. Everything that goes on top of the head is laid out in ONE place, in one
  // order. The base's own NOSE and EARS are lifted out and re-laid with it, because where
  // the base puts them (last) cannot satisfy all of these at once:
  //
  //   ears          hair falls OVER the ear; a beard's tufts grow in FRONT of it
  //   eyes, brows   a lock falling past the eye passes in front of it, so hair is later
  //   hair          ...but EARLIER than facial hair. Ryan, 2026-09-19: with long hair the
  //                 bushy beard was buried behind it. A beard is on the FACE and the hair
  //                 falls beside it, so the beard wins. The two rules are not in tension:
  //                 the eyes are high and the beard is low, and both hold at once.
  //   facial hair   over the hair, under the nose
  //   mouth         UNDER a moustache (it hangs over the lip) but OVER a beard (the mouth
  //                 sits in the mass) — declared per style in facialhair/manifest.json,
  //                 because coverage cannot decide it: a moustache overlaps the mouth
  //                 region by 34% and stubble by 78%, with nothing clean in between
  //   nose          always last: a raised moustache must never swallow its tip
  const ears = findEars(svg);
  for (const e of ears) svg = svg.replace(e, '');
  // ⭐ a garment REPLACES the base's shirt, so the shirt is lifted out like the ears and nose.
  const garment = c.garment ? ((ASSETS.garments||{})[c.garment] || '') : '';
  if (garment) for (const m of svg.matchAll(/<path[^>]*\/?>/g))
    if (m[0].includes(`fill="${T.shirt}"`) || m[0].includes(`fill="${T.shirt2}"`)) svg = svg.replace(m[0], '');
  const nose = findNose(svg);
  if (nose) svg = svg.replace(nose, '');

  // ⚠⚠ An EXPRESSION is a whole face in ONE fragment — eyes, brows, cheeks AND mouth — so
  // there is no single place for it: its brows must sit UNDER the hair and its mouth must
  // sit OVER a beard. It is therefore SPLIT, on each path's TOP edge.
  //
  // ⭐ The line is not arbitrary. Measured across all 102 paths in the 12 shipped
  // expressions: the upper group — eyes, irises, brows, cheeks, tears — never starts below
  // y999.5, and the lower group — lips, mouth interior, tongue, teeth and chin marks —
  // never starts above y1145.5. y1072 is the middle of that gap and sits just above the
  // beard's own top edge at y1105.8, which is the boundary the split exists for.
  //
  // ⚠ Classifying by TOKEN does not work: an open mouth's TEETH carry the eye-white token,
  // and `laughing`/`sad` put a skin-shade chin mark below the lip. Position does work. A
  // guard test re-derives the gap from the shipped assets, so a new expression straddling
  // the line fails the build instead of rendering a brow over a fringe.
  // ⭐ the two derived body layers — see compose.ts's THE STACK for why they exist.
  // ⚠ per style — one shared fill leaves a hair-coloured rim on the shoulders.
  const backfill = (c.hair && (ASSETS.hairManifest||{})[c.hair]) ? ((ASSETS.hairBackfill||{})[c.hair] || '') : '';
  // ⭐ The earring paints AFTER the hair unless the style HIDES THE EAR — only two do.
  // ⚠ An earring hangs BELOW the ear, so hair passing behind the ear still clips the drop.
  const earringsFront = !(c.hair && (ASSETS.hairCoversEar||[]).includes(c.hair));
  // ⚠ painted when there is hair OR a garment; with a garment it is the only body layer.
  // ⭐⭐ two fragments: the shirt half (which a garment substitutes for) and the neck half,
  // which is what CUTS THE COLLAR — a traced garment is solid, the per-base neck cuts it.
  // ⭐ the SP chest mark — one asset. 🔴 this slot takes OUR mark only, never a club crest.
  const markLayer = c.mark ? (ASSETS.mark || '') : '';
  const neckKey = (/(\d+)$/.exec(c.base)||[])[1] || '';
  const frontBody = (c.hair || garment || markLayer)
    ? (garment || ((ASSETS.frontShirt||{})[neckKey] || '')) + ((ASSETS.frontNeck||{})[neckKey] || '')
    : '';
  // ⭐ hair falling in front of the FACE goes back on top of the beard — the fragment painted a
  // second time, masked to the head. See compose.ts for why.
  const headD = (fh && c.hair) ? findHead(svg) : null;
  const hairFront = headD
    ? `<defs><mask id="faceonly" maskUnits="userSpaceOnUse" x="0" y="0" width="2048" height="2048">`
      + `<path d="${headD}" fill="white"/></mask></defs>`
      + `<g mask="url(#faceonly)">${(ASSETS.hair[c.hair]||'').split('facehole').join('facehole-front')}</g>`
    : '';

  const expr = (c.mode === 'expression' && c.expression) ? ASSETS.expressions[c.expression] : '';
  const upper = [], lower = [];
  for (const m of (expr || '').matchAll(/<path[^>]*\/?>/g)) {
    const d = /d="([^"]*)"/.exec(m[0]);
    const n = d ? (d[1].match(/-?\d+\.?\d*/g) || []).map(Number) : [];
    const ys = n.filter((_, i) => i % 2 === 1);
    (ys.length && Math.min(...ys) >= 1072 ? lower : upper).push(m[0]);
  }
  const eyes  = (!tinted && c.mode !== 'expression' && c.eyes) ? (ASSETS.eyes[c.eyes] || ASSETS.specialEyes[c.eyes]) : '';
  // ⚠ not `mouth` — the recolour pass below binds that name to the mouth COLOUR.
  const mouthLayer = ((c.mode !== 'expression' && c.mouth) ? ASSETS.mouths[c.mouth] : '') + lower.join('');

  add(ears.join('') + (earringsFront ? '' : earringsLayer)
      + eyes + (tinted ? stripEyes(upper.join('')) : upper.join(''))
      + (fhOver ? mouthLayer : '')
      + backfill + (c.hair ? ASSETS.hair[c.hair] : '') + frontBody + markLayer
      + (fh ? swapAll(fh, T.hairBase, T.beard) : '') + hairFront
      + (earringsFront ? earringsLayer : '')
      // ⭐⭐ eyewear goes IN FRONT of the hair — 98.4-99.5% of every eyewear asset sits inside
      // the head silhouette, temple included, so there is no placement that fronts the lenses
      // and leaves the arms behind. See compose.ts for the measurement.
      + glassesLayer
      + (fhOver ? '' : mouthLayer)
      + (nose || ''));

  /* --- recolour, once, over the finished document --- */
  const eye = hex2rgb(c.eyeColour), mouth = hex2rgb(c.mouthColour);
  const hair = hex2rgb(c.hairColour), skin = hex2rgb(c.skin), shirt = hex2rgb(c.shirt);

  svg = swapAll(svg, T.irisCore, rgbStr(eye));
  svg = swapAll(svg, T.irisRim,  lighten(eye,1.28));

  /* ⚠ Floored first — ink, interior and tongue all derive from this tone. */
  const mouthLit = mouthAgainstSkin(mouth, skin);
  svg = swapAll(svg, T.mouthInk,    rgbStr(mouthLit));
  svg = swapAll(svg, T.mouthDark,   darken(mouthLit,0.65));
  svg = swapAll(svg, T.mouthTongue, lighten(mouthLit,1.13));

  if (svg.includes(T.frameInk) || svg.includes(T.lensTint) || svg.includes(T.glint)) {
    const frame = hex2rgb(c.frameColour || DEFAULT_FRAME);
    svg = swapAll(svg, T.frameInk, rgbStr(frame));
    svg = swapAll(svg, T.lensTint, rgbStr(LENS_BLACK));
    svg = swapAll(svg, T.glint, rgbStr(GLASS_TINT));
  }
  if (svg.includes(T.metal)) svg = swapAll(svg, T.metal, rgbStr(hex2rgb(c.metalColour || DEFAULT_METAL)));
  svg = swapAll(svg, T.browInk, darken(hair,0.82));          // brows follow hair, NOT the beard
  // ⭐⭐ Facial hair's own colour. The LIFT belongs to the fallback alone: BEARD_LIFT exists so
  // a beard does not vanish into head hair of the SAME colour, which choosing a colour rules
  // out — applying it anyway would make the swatch lie. Mirrors lib/avatar/compose.ts.
  // ⚠ `||`, not `??`: publicConfig() below coerces unset optional fields to '', and hex2rgb('')
  // is NaN, which would paint rgb(NaN,NaN,NaN) over the whole beard.
  const fhChosen = !!c.facialHairColour;
  const fhRgb = fhChosen ? hex2rgb(c.facialHairColour || c.hairColour) : hair;
  const beardTone = fhChosen
    ? rgbStr(fhRgb)
    : rgbStr(fhRgb.map(v => Math.min(255, v + BEARD_LIFT)));
  svg = swapAll(svg, T.beard, beardTone);
  // ⚠ The standalone builder has no fade gradient (compose.ts does). Without this the marker
  // rendered as raw violet on every fullbeard and stubble — flatten it the way `fade: false` does.
  svg = swapAll(svg, T.fade, svg.includes(T.stubble) ? stubbleTone(fhRgb, skin) : beardTone);
  svg = swapAll(svg, T.stubble, stubbleTone(fhRgb, skin));   // stubble: a shadow, not a short beard
  svg = swapAll(svg, T.hairBase,  rgbStr(hair));
  svg = swapAll(svg, T.hairShade, darken(hair));
  svg = swapAll(svg, T.hairLight, lighten(hair));

  svg = swapAll(svg, T.skin,      rgbStr(skin));
  svg = swapAll(svg, T.skinShade, darken(skin,0.88));
  svg = swapAll(svg, T.blush,     mix(skin,[232,112,104],0.22));   // a blush is noticed, not seen

  svg = swapAll(svg, T.shirt,  rgbStr(shirt));
  svg = swapAll(svg, T.shirt2, darken(shirt,0.9));
  svg = swapAll(svg, T.shirtLight, lighten(shirt,1.25));
  svg = swapAll(svg, T.markInk, mix(shirt,[255,255,255],0.72));
  svg = paintCanvas(svg, rgbStr(hex2rgb(c.bg)));
  // ⚠ LAST, over the finished document: until here the hair copy is renamed by literal id.
  return uniquifyIds(svg);
}

/* ---- state ------------------------------------------------------------------------- */
const SKINS  = ['#FFE0C4','#F7D9BC','#F5C9A6','#EBBA92','#E0AC7E','#D39960','#C68642','#B7793A','#A96D33','#9B612B','#8D5524','#7C4B25','#6B4226','#5A371D','#4A2C14'];
const HAIRS  = ['#1A1110','#2B1B12','#4A3B32','#6B4A2F','#A9713B','#D4A857','#B33A3A','#8E8E93','#E8E8ED'];
const EYECOL = ['#3E2612','#5B3A1E','#8B5E3C','#2E7D32','#2E6FD9','#4B5563'];
const MOUTHS = ['#B67A70','#C4736B','#A85E58','#D08A82'];
const SHIRTS = ['#3B6EFF','#16A34A','#C2410C','#7C3AED','#0F766E','#DB2777','#111827','#F59E0B'];
const BGS    = ['#F47A93','#FFC3C4','#FE9F98','#E98661','#BB9E43','#BDBD71','#88AC52','#BDDAA9','#7EC993','#0DB68B','#93E0CE','#0DB3A9','#17CBDE','#8CDDFA','#5AC3FE','#41A6FA','#BFD2FE','#A6B5FF','#AB92EB','#D285D3','#F8C1E7','#EA7CB4'];
const FRAMES = ['#22262E','#6B4A2F','#C9A227','#9AA3AD','#1F3A64','#B36A72'];
const METALS = ['#D4A017','#B8BCC4','#C08878','#2A2A2E','#E8E0C8','#8C6239'];

const cfg = {
  mode:'expression', base:'base-neck-100',
  hair:'m03-quiff', expression:'x-happy', facialhair:'', glasses:'', frameColour:'#22262E',
  earrings:'', metalColour:'#D4A017', garment:'', mark:false,
  eyes:'eye-01-base', mouth:'mouth-02-smile',
  skin:'#F5C9A6', hairColour:'#4A3B32', facialHairColour:'', eyeColour:'#5B3A1E',
  mouthColour:'#B67A70', shirt:'#3B6EFF', bg:'#0E7490',
};

/* ---- UI ---------------------------------------------------------------------------- */
const el = (t,a={},kids=[]) => { const n=document.createElement(t);
  for (const [k,v] of Object.entries(a)) k==='text'? n.textContent=v : n.setAttribute(k,v);
  kids.forEach(c=>n.appendChild(c)); return n; };

function chipRow(title, keys, current, onPick, labelFn = k=>k){
  const g = el('div',{class:'group'},[el('h2',{text:title})]);
  const box = el('div',{class:'chips'});
  keys.forEach(k => {
    const b = el('button',{class:'chip',type:'button','aria-pressed': String(k===current())});
    b.textContent = labelFn(k);
    b.onclick = () => { onPick(k); render(); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}
function swatchRow(title, colours, current, onPick){
  const g = el('div',{class:'group'},[el('h2',{text:title})]);
  const box = el('div',{class:'swatches'});
  colours.forEach(c => {
    const b = el('button',{class:'sw',type:'button','aria-pressed':String(c===current()),
                           style:`background:${c}`, title:c});
    b.onclick = () => { onPick(c); render(); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}

function buildPanel(){
  const p = document.getElementById('panel');
  p.innerHTML = '';

  const modes = el('div',{class:'group'},[el('h2',{text:'Face'})]);
  const mrow = el('div',{class:'chips'});
  [['expression','Expression (whole face)'],['parts','Eyes + mouth separately']].forEach(([k,label])=>{
    const b = el('button',{class:'chip',type:'button','aria-pressed':String(cfg.mode===k)});
    b.textContent = label;
    b.onclick = ()=>{ cfg.mode=k; render(); };
    mrow.appendChild(b);
  });
  modes.appendChild(mrow); p.appendChild(modes);

  if (cfg.mode==='expression'){
    p.appendChild(chipRow('Expression', Object.keys(ASSETS.expressions), ()=>cfg.expression,
                          v=>cfg.expression=v, k=>k.replace(/^x-/,'')));
  } else {
    p.appendChild(chipRow('Eyes', [...Object.keys(ASSETS.eyes),...Object.keys(ASSETS.specialEyes)],
                          ()=>cfg.eyes, v=>cfg.eyes=v, k=>k.replace('eye-','').replace(/^\d+-/,'')));
    p.appendChild(chipRow('Mouth', Object.keys(ASSETS.mouths), ()=>cfg.mouth, v=>cfg.mouth=v,
                          k=>k.replace('mouth-','').replace(/^\d+-/,'')));
  }

  p.appendChild(chipRow('Hair', ['', ...Object.keys(ASSETS.hair)], ()=>cfg.hair,
                        v=>cfg.hair=v, k=>k===''?'bald':k));
  p.appendChild(chipRow('Facial hair', ['', ...Object.keys(ASSETS.facialhair)], ()=>cfg.facialhair,
                        v=>cfg.facialhair=v, k=>k===''?'none':k));
  p.appendChild(chipRow('Eyewear', ['', ...Object.keys(ASSETS.glasses||{})], ()=>cfg.glasses,
                        v=>cfg.glasses=v, k=>k===''?'none':k.replace(/^[gs]\d+-/,'')));
  p.appendChild(chipRow('SP mark', ['', 'on'], ()=>cfg.mark?'on':'',
                        v=>cfg.mark=(v==='on'), k=>k===''?'off':'on'));
  p.appendChild(chipRow('Garment', ['', ...Object.keys(ASSETS.garments||{})], ()=>cfg.garment,
                        v=>cfg.garment=v, k=>k===''?'shirt':k.replace(/^w\d+-/,'')));
  p.appendChild(chipRow('Earrings', ['', ...Object.keys(ASSETS.earrings||{})], ()=>cfg.earrings,
                        v=>cfg.earrings=v, k=>k===''?'none':k.replace(/^e\d+-/,'')));
  p.appendChild(chipRow('Build', Object.keys(ASSETS.bases), ()=>cfg.base, v=>cfg.base=v,
                        k=>k.replace('base-neck-','neck ')));
  p.appendChild(swatchRow('Skin',  SKINS,  ()=>cfg.skin,        v=>cfg.skin=v));
  p.appendChild(swatchRow('Hair colour', HAIRS, ()=>cfg.hairColour, v=>cfg.hairColour=v));
  // ⚠ '' is a REAL choice here, not an empty field: it means "follow the hair", which is the
  // only path that applies BEARD_LIFT. Clicking the swatch already selected clears back to it.
  p.appendChild(swatchRow('Facial hair colour', HAIRS, ()=>cfg.facialHairColour,
    v=>cfg.facialHairColour = (cfg.facialHairColour===v ? '' : v)));
  p.appendChild(swatchRow('Eyes',  EYECOL, ()=>cfg.eyeColour,   v=>cfg.eyeColour=v));
  p.appendChild(swatchRow('Mouth', MOUTHS, ()=>cfg.mouthColour, v=>cfg.mouthColour=v));
  if (cfg.glasses) p.appendChild(swatchRow('Frame', FRAMES, ()=>cfg.frameColour, v=>cfg.frameColour=v));
  if (cfg.earrings) p.appendChild(swatchRow('Metal', METALS, ()=>cfg.metalColour, v=>cfg.metalColour=v));
  p.appendChild(swatchRow('Shirt', SHIRTS, ()=>cfg.shirt,       v=>cfg.shirt=v));
  p.appendChild(swatchRow('Background', BGS, ()=>cfg.bg,        v=>cfg.bg=v));
}

function publicConfig(){
  const c = { base:cfg.base.replace('base-neck-',''), skin:cfg.skin,
              hair:cfg.hair||null, hairColour:cfg.hairColour,
              facialHair:cfg.facialhair||null, glasses:cfg.glasses||null,
              earrings:cfg.earrings||null, metalColour:cfg.metalColour,
              garment:cfg.garment||null, mark:cfg.mark||false,
              frameColour:cfg.frameColour, shirt:cfg.shirt, background:cfg.bg };
  // ⚠⚠ OMITTED WHEN UNSET, never written as a copy of hairColour. The two are different
  // renders: absent means "follow the hair, lifted by BEARD_LIFT", present means "verbatim".
  // Emitting the hair's own hex here would quietly darken every beard by 12 per channel.
  if (cfg.facialHairColour) c.facialHairColour = cfg.facialHairColour;
  if (cfg.mode==='expression') { c.expression=cfg.expression; c.eyeColour=cfg.eyeColour;
                                 c.mouthColour=cfg.mouthColour; }
  else { c.eyes=cfg.eyes; c.mouth=cfg.mouth; c.eyeColour=cfg.eyeColour;
         c.mouthColour=cfg.mouthColour; }
  return c;
}

let lastSvg = '';
function render(){
  buildPanel();
  lastSvg = compose(cfg);
  document.getElementById('stage').innerHTML = lastSvg;
  for (const [id,px] of [['s96',96],['s56',56],['s32',32]]){
    const d = document.getElementById(id);
    d.style.width = d.style.height = px+'px';
    d.innerHTML = lastSvg.replace(/width="\d+"/,`width="${px}"`).replace(/height="\d+"/,`height="${px}"`);
  }
  const j = JSON.stringify(publicConfig(), null, 1);
  document.getElementById('cfg').textContent = j + `\n\n// ${new Blob([j]).size} bytes`;
}

const pick = a => a[Math.floor(Math.random()*a.length)];
document.getElementById('rand').onclick = () => {
  cfg.hair = pick(Object.keys(ASSETS.hair));
  cfg.facialhair = pick(['','','', ...Object.keys(ASSETS.facialhair)]);
  cfg.expression = pick(Object.keys(ASSETS.expressions));
  cfg.eyes = pick(Object.keys(ASSETS.eyes));
  cfg.mouth = pick(Object.keys(ASSETS.mouths));
  cfg.base = pick(Object.keys(ASSETS.bases));
  cfg.skin = pick(SKINS); cfg.hairColour = pick(HAIRS); cfg.eyeColour = pick(EYECOL);
  cfg.mouthColour = pick(MOUTHS); cfg.shirt = pick(SHIRTS); cfg.bg = pick(BGS);
  render();
};
document.getElementById('copySvg').onclick = () => navigator.clipboard.writeText(lastSvg);
document.getElementById('copyCfg').onclick = () =>
  navigator.clipboard.writeText(JSON.stringify(publicConfig(), null, 2));

document.getElementById('counts').textContent =
  `${Object.keys(ASSETS.bases).length} bases · ${Object.keys(ASSETS.hair).length} hair · ` +
  `${Object.keys(ASSETS.expressions).length} expressions · ` +
  `${Object.keys(ASSETS.facialhair).length} facial hair · ` +
  `${Object.keys(ASSETS.glasses||{}).length} eyewear · ` +
  `${Object.keys(ASSETS.earrings||{}).length} earrings · ` +
  `${Object.keys(ASSETS.garments||{}).length} garments · ` +
  `${Object.keys(ASSETS.eyes).length + Object.keys(ASSETS.specialEyes).length} eyes · ` +
  `${Object.keys(ASSETS.mouths).length} mouths`;
render();
</script>
</body>
