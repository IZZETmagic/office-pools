<!DOCTYPE html>
<!--
  SportPool avatar builder — generated by build-builder.py. Do not edit this file directly;
  edit the template and re-run, or your changes are lost on the next build.

  The compose logic below is a PORT OF compose.py. compose.py is the reference; if they
  drift, this page lies about what the product will render.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SportPool avatar builder</title>
<style>
  :root {
    --ink:#16181d; --muted:#6b7280; --line:#e6e8ec; --bg:#f6f7f9; --card:#fff;
    --accent:#2563eb;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:14px; position:sticky; top:0; z-index:5 }
  header h1 { margin:0; font-size:16px; font-weight:650; letter-spacing:-.01em }
  header .sub { color:var(--muted); font-size:12px }
  .wrap { display:grid; grid-template-columns:340px 1fr; gap:20px; padding:20px; align-items:start }
  @media (max-width:900px){ .wrap { grid-template-columns:1fr } }

  .stage { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:20px;
           position:sticky; top:70px }
  .stage .av { width:100%; aspect-ratio:1; border-radius:14px; overflow:hidden; background:#fff }
  .stage .av svg { width:100%; height:100%; display:block }
  .sizes { display:flex; gap:14px; align-items:flex-end; margin-top:16px; padding-top:14px;
           border-top:1px solid var(--line) }
  .sizes div { border-radius:6px; overflow:hidden; background:#fff }
  .sizes svg { display:block }
  .sizes span { color:var(--muted); font-size:11px; margin-left:auto }

  .panel { display:flex; flex-direction:column; gap:14px }
  .group { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px }
  .group h2 { margin:0 0 10px; font-size:12px; font-weight:650; text-transform:uppercase;
              letter-spacing:.07em; color:var(--muted) }
  .chips { display:flex; flex-wrap:wrap; gap:6px }
  .chip { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 11px;
          font-size:12.5px; cursor:pointer; color:#374151 }
  .chip:hover { border-color:#c7cbd3 }
  .chip[aria-pressed="true"] { background:var(--ink); border-color:var(--ink); color:#fff }
  .swatches { display:flex; flex-wrap:wrap; gap:7px }
  .sw { width:26px; height:26px; border-radius:50%; border:2px solid #fff; cursor:pointer;
        box-shadow:0 0 0 1px var(--line) }
  .sw[aria-pressed="true"] { box-shadow:0 0 0 2px var(--accent) }
  .row { display:flex; align-items:center; gap:10px; margin-top:8px }
  .row label { font-size:12px; color:var(--muted); min-width:64px }
  input[type=range] { flex:1 }
  .out { background:#0f1115; color:#d7dce5; border-radius:12px; padding:12px 14px; font-size:12px;
         font-family:ui-monospace,SFMono-Regular,Menlo,monospace; white-space:pre; overflow-x:auto }
  .bar { display:flex; gap:8px; flex-wrap:wrap }
  .btn { border:1px solid var(--line); background:#fff; border-radius:9px; padding:7px 13px;
         font-size:13px; cursor:pointer }
  .btn:hover { border-color:#c7cbd3 }
  .btn.primary { background:var(--ink); color:#fff; border-color:var(--ink) }
  .note { color:var(--muted); font-size:11.5px; margin-top:8px }
</style>
</head>
<body>
<header>
  <h1>SportPool avatar builder</h1>
  <span class="sub" id="counts"></span>
</header>

<div class="wrap">
  <div class="stage">
    <div class="av" id="stage"></div>
    <div class="sizes">
      <div id="s96"></div><div id="s56"></div><div id="s32"></div>
      <span>rendered at 96 / 56 / 32px</span>
    </div>
    <div class="bar" style="margin-top:14px">
      <button class="btn primary" id="rand">Randomise</button>
      <button class="btn" id="copySvg">Copy SVG</button>
      <button class="btn" id="copyCfg">Copy config</button>
    </div>
    <div class="out" id="cfg" style="margin-top:12px"></div>
    <div class="note">The config is what a member record stores — about 200 bytes, never an image.</div>
  </div>

  <div class="panel" id="panel"></div>
</div>

<script>
/*__DATA__*/

/* ---- colour helpers: ports of compose.py ------------------------------------------- */
const hex2rgb = h => { h = h.replace('#',''); return [0,2,4].map(i => parseInt(h.slice(i,i+2),16)); };
const rgbStr  = c => `rgb(${c[0]},${c[1]},${c[2]})`;
const darken  = (c,f=0.78) => rgbStr(c.map(v => Math.max(0, Math.trunc(v*f))));
const lighten = (c,f=1.22) => rgbStr(c.map(v => Math.min(255, Math.trunc(v*f))));
const mix     = (a,b,t)    => rgbStr(a.map((v,i) => Math.trunc(v + (b[i]-v)*t)));

/* ---- tokens, exactly as the assets carry them -------------------------------------- */
const T = {
  hairBase:'rgb(140,122,110)', hairShade:'rgb(114,97,86)', hairLight:'rgb(168,150,138)',
  skin:'rgb(254,205,180)', skinShade:'rgb(245,178,150)',
  shirt:'rgb(30,118,214)', shirt2:'rgb(50,118,183)', bg:'rgb(255,255,255)',
  irisCore:'rgb(117,62,21)', irisRim:'rgb(150,84,34)',
  mouthInk:'rgb(182,122,112)', mouthDark:'rgb(118,72,68)', mouthTongue:'rgb(206,116,112)',
  browInk:'rgb(101,70,52)', blush:'rgb(240,158,138)', stubble:'rgb(164,150,140)',
};
const swapAll = (s,find,rep) => s.split(`fill="${find}"`).join(`fill="${rep}"`);

/* ---- find the base's nose, by shape ------------------------------------------------
   The ears share its exact tone and so does the neck shadow, so colour alone cannot do it.
   Narrow, centred, upper-middle is the nose. Same test as compose.py.                   */
function findNose(doc){
  for (const m of doc.matchAll(/<path[^>]*\/?>/g)) {
    const p = m[0];
    if (!p.includes(`fill="${T.skinShade}"`)) continue;
    const d = /d="([^"]*)"/.exec(p); if (!d) continue;
    const n = (d[1].match(/-?\d+\.?\d*/g) || []).map(Number);
    const xs = n.filter((_,i)=>i%2===0), ys = n.filter((_,i)=>i%2===1);
    if (!xs.length) continue;
    const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys);
    if (x1-x0 < 200 && (x0+x1)/2 > 900 && (x0+x1)/2 < 1150 && y0 > 900 && y0 < 1200) return p;
  }
  return null;
}

/* ---- compose: layer first, recolour second -----------------------------------------
   ⚠ These two phases must not interleave. In compose.py they once did, and --eye-colour
   silently did nothing to whole-face expressions because the swap ran before the paths
   it was meant to catch existed.                                                        */
function compose(c){
  let svg = ASSETS.bases[c.base];
  const add = frag => { svg = svg.replace('</svg>', frag + '</svg>'); };

  const fh = c.facialhair ? ASSETS.facialhair[c.facialhair] : null;
  const fhOver = !!(c.facialhair && (ASSETS.fhManifest[c.facialhair]||{}).over);

  // Facial hair that sits UNDER the mouth goes in before the nose, so a moustache tucks
  // behind the nose instead of swallowing its tip.
  if (fh && !fhOver) {
    const nose = findNose(svg);
    if (nose) svg = svg.replace(nose, fh + nose); else add(fh);
  }

  if (c.mode === 'expression') {
    if (c.expression) add(ASSETS.expressions[c.expression]);
  } else {
    if (c.eyes) add((ASSETS.eyes[c.eyes] || ASSETS.specialEyes[c.eyes]));
    if (c.mouth) add(ASSETS.mouths[c.mouth]);
  }

  // An "over" style goes on after the face, taking the nose with it so the nose stays on top.
  if (fh && fhOver) {
    const nose = findNose(svg);
    if (nose) svg = svg.replace(nose, '');
    add(fh + (nose || ''));
  }

  if (c.hair) add(ASSETS.hair[c.hair]);

  /* --- recolour, once, over the finished document --- */
  const eye = hex2rgb(c.eyeColour), mouth = hex2rgb(c.mouthColour);
  const hair = hex2rgb(c.hairColour), skin = hex2rgb(c.skin), shirt = hex2rgb(c.shirt);

  svg = swapAll(svg, T.irisCore, rgbStr(eye));
  svg = swapAll(svg, T.irisRim,  lighten(eye,1.28));

  svg = swapAll(svg, T.mouthInk,    rgbStr(mouth));
  svg = swapAll(svg, T.mouthDark,   darken(mouth,0.65));
  svg = swapAll(svg, T.mouthTongue, lighten(mouth,1.13));

  svg = swapAll(svg, T.browInk, darken(hair,0.82));          // brows follow hair
  svg = swapAll(svg, T.stubble, mix(hair, skin, 0.55));      // stubble: hair toward skin
  svg = swapAll(svg, T.hairBase,  rgbStr(hair));
  svg = swapAll(svg, T.hairShade, darken(hair));
  svg = swapAll(svg, T.hairLight, lighten(hair));

  svg = swapAll(svg, T.skin,      rgbStr(skin));
  svg = swapAll(svg, T.skinShade, darken(skin,0.88));
  svg = swapAll(svg, T.blush,     mix(skin,[232,112,104],0.22));   // a blush is noticed, not seen

  svg = swapAll(svg, T.shirt,  rgbStr(shirt));
  svg = swapAll(svg, T.shirt2, darken(shirt,0.9));
  svg = swapAll(svg, T.bg,     rgbStr(hex2rgb(c.bg)));
  return svg;
}

/* ---- state ------------------------------------------------------------------------- */
const SKINS  = ['#FFE0C4','#F7D9BC','#F5C9A6','#E0AC7E','#C68642','#8D5524','#6B4226','#4A2C14'];
const HAIRS  = ['#1A1110','#2B1B12','#4A3B32','#6B4A2F','#A9713B','#D4A857','#B33A3A','#8E8E93','#E8E8ED'];
const EYECOL = ['#3E2612','#5B3A1E','#8B5E3C','#2E7D32','#2E6FD9','#4B5563'];
const MOUTHS = ['#B67A70','#C4736B','#A85E58','#D08A82'];
const SHIRTS = ['#3B6EFF','#16A34A','#C2410C','#7C3AED','#0F766E','#DB2777','#111827','#F59E0B'];
const BGS    = ['#FFFFFF','#EEF2FF','#ECFDF5','#FEF3C7','#FCE7F3','#F3F4F6'];

const cfg = {
  mode:'expression', base:'base-neck-100',
  hair:'m03-quiff', expression:'x-happy', facialhair:'',
  eyes:'eye-01-base', mouth:'mouth-02-smile',
  skin:'#F5C9A6', hairColour:'#4A3B32', eyeColour:'#5B3A1E',
  mouthColour:'#B67A70', shirt:'#3B6EFF', bg:'#FFFFFF',
};

/* ---- UI ---------------------------------------------------------------------------- */
const el = (t,a={},kids=[]) => { const n=document.createElement(t);
  for (const [k,v] of Object.entries(a)) k==='text'? n.textContent=v : n.setAttribute(k,v);
  kids.forEach(c=>n.appendChild(c)); return n; };

function chipRow(title, keys, current, onPick, labelFn = k=>k){
  const g = el('div',{class:'group'},[el('h2',{text:title})]);
  const box = el('div',{class:'chips'});
  keys.forEach(k => {
    const b = el('button',{class:'chip',type:'button','aria-pressed': String(k===current())});
    b.textContent = labelFn(k);
    b.onclick = () => { onPick(k); render(); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}
function swatchRow(title, colours, current, onPick){
  const g = el('div',{class:'group'},[el('h2',{text:title})]);
  const box = el('div',{class:'swatches'});
  colours.forEach(c => {
    const b = el('button',{class:'sw',type:'button','aria-pressed':String(c===current()),
                           style:`background:${c}`, title:c});
    b.onclick = () => { onPick(c); render(); };
    box.appendChild(b);
  });
  g.appendChild(box); return g;
}

function buildPanel(){
  const p = document.getElementById('panel');
  p.innerHTML = '';

  const modes = el('div',{class:'group'},[el('h2',{text:'Face'})]);
  const mrow = el('div',{class:'chips'});
  [['expression','Expression (whole face)'],['parts','Eyes + mouth separately']].forEach(([k,label])=>{
    const b = el('button',{class:'chip',type:'button','aria-pressed':String(cfg.mode===k)});
    b.textContent = label;
    b.onclick = ()=>{ cfg.mode=k; render(); };
    mrow.appendChild(b);
  });
  modes.appendChild(mrow); p.appendChild(modes);

  if (cfg.mode==='expression'){
    p.appendChild(chipRow('Expression', Object.keys(ASSETS.expressions), ()=>cfg.expression,
                          v=>cfg.expression=v, k=>k.replace(/^x-/,'')));
  } else {
    p.appendChild(chipRow('Eyes', [...Object.keys(ASSETS.eyes),...Object.keys(ASSETS.specialEyes)],
                          ()=>cfg.eyes, v=>cfg.eyes=v, k=>k.replace('eye-','').replace(/^\d+-/,'')));
    p.appendChild(chipRow('Mouth', Object.keys(ASSETS.mouths), ()=>cfg.mouth, v=>cfg.mouth=v,
                          k=>k.replace('mouth-','').replace(/^\d+-/,'')));
  }

  p.appendChild(chipRow('Hair', ['', ...Object.keys(ASSETS.hair)], ()=>cfg.hair,
                        v=>cfg.hair=v, k=>k===''?'bald':k));
  p.appendChild(chipRow('Facial hair', ['', ...Object.keys(ASSETS.facialhair)], ()=>cfg.facialhair,
                        v=>cfg.facialhair=v, k=>k===''?'none':k));
  p.appendChild(chipRow('Build', Object.keys(ASSETS.bases), ()=>cfg.base, v=>cfg.base=v,
                        k=>k.replace('base-neck-','neck ')));
  p.appendChild(swatchRow('Skin',  SKINS,  ()=>cfg.skin,        v=>cfg.skin=v));
  p.appendChild(swatchRow('Hair colour', HAIRS, ()=>cfg.hairColour, v=>cfg.hairColour=v));
  p.appendChild(swatchRow('Eyes',  EYECOL, ()=>cfg.eyeColour,   v=>cfg.eyeColour=v));
  p.appendChild(swatchRow('Mouth', MOUTHS, ()=>cfg.mouthColour, v=>cfg.mouthColour=v));
  p.appendChild(swatchRow('Shirt', SHIRTS, ()=>cfg.shirt,       v=>cfg.shirt=v));
  p.appendChild(swatchRow('Background', BGS, ()=>cfg.bg,        v=>cfg.bg=v));
}

function publicConfig(){
  const c = { base:cfg.base.replace('base-neck-',''), skin:cfg.skin,
              hair:cfg.hair||null, hairColour:cfg.hairColour,
              facialHair:cfg.facialhair||null, shirt:cfg.shirt, background:cfg.bg };
  if (cfg.mode==='expression') { c.expression=cfg.expression; c.eyeColour=cfg.eyeColour;
                                 c.mouthColour=cfg.mouthColour; }
  else { c.eyes=cfg.eyes; c.mouth=cfg.mouth; c.eyeColour=cfg.eyeColour;
         c.mouthColour=cfg.mouthColour; }
  return c;
}

let lastSvg = '';
function render(){
  buildPanel();
  lastSvg = compose(cfg);
  document.getElementById('stage').innerHTML = lastSvg;
  for (const [id,px] of [['s96',96],['s56',56],['s32',32]]){
    const d = document.getElementById(id);
    d.style.width = d.style.height = px+'px';
    d.innerHTML = lastSvg.replace(/width="\d+"/,`width="${px}"`).replace(/height="\d+"/,`height="${px}"`);
  }
  const j = JSON.stringify(publicConfig(), null, 1);
  document.getElementById('cfg').textContent = j + `\n\n// ${new Blob([j]).size} bytes`;
}

const pick = a => a[Math.floor(Math.random()*a.length)];
document.getElementById('rand').onclick = () => {
  cfg.hair = pick(Object.keys(ASSETS.hair));
  cfg.facialhair = pick(['','','', ...Object.keys(ASSETS.facialhair)]);
  cfg.expression = pick(Object.keys(ASSETS.expressions));
  cfg.eyes = pick(Object.keys(ASSETS.eyes));
  cfg.mouth = pick(Object.keys(ASSETS.mouths));
  cfg.base = pick(Object.keys(ASSETS.bases));
  cfg.skin = pick(SKINS); cfg.hairColour = pick(HAIRS); cfg.eyeColour = pick(EYECOL);
  cfg.mouthColour = pick(MOUTHS); cfg.shirt = pick(SHIRTS); cfg.bg = pick(BGS);
  render();
};
document.getElementById('copySvg').onclick = () => navigator.clipboard.writeText(lastSvg);
document.getElementById('copyCfg').onclick = () =>
  navigator.clipboard.writeText(JSON.stringify(publicConfig(), null, 2));

document.getElementById('counts').textContent =
  `${Object.keys(ASSETS.bases).length} bases · ${Object.keys(ASSETS.hair).length} hair · ` +
  `${Object.keys(ASSETS.expressions).length} expressions · ` +
  `${Object.keys(ASSETS.facialhair).length} facial hair · ` +
  `${Object.keys(ASSETS.eyes).length + Object.keys(ASSETS.specialEyes).length} eyes · ` +
  `${Object.keys(ASSETS.mouths).length} mouths`;
render();
</script>
</body>
</html>
