<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banter keyboard prototype</title>
<!--
  ============================================================
  SLICE 0 — drafts/2026-09-01_showdown_banter_plan.md
  ============================================================
  ⚠ THROWAWAY. Delete this file once the question is answered. It lives in
  public/ for one reason: it has to be openable on a real phone, and a phone
  cannot reach localhost. It is inert — no data, no auth, no imports.

  THE QUESTION IT EXISTS TO ANSWER:

    Can a bottom sheet with a text input sit above the mobile keyboard
    WITHOUT `document.body { position: fixed }`?

  That constraint is the whole reason this is slice 0. CommunityTab pins the
  body to make the chat fill the screen, and the Showdown band's collapse is
  driven by `window.scrollY` — pin the body and scrollY stops moving, so the
  band freezes open. If a sheet cannot behave with the keyboard up without
  that hack, the banter plan changes shape.

  The page therefore carries a REAL scroll-driven band, so you can see whether
  the two coexist rather than taking it on trust: scroll the page, open the
  sheet, focus the input, and watch whether the band is still alive underneath.

  WHAT TO CHECK ON THE DEVICE
    1. Composer sits directly on the keyboard, not under it.
    2. The message list is still scrollable with the keyboard up.
    3. The page behind does not jump when the sheet opens or closes.
    4. `scrollY` in the readout still moves after you close the sheet.
    5. Rotate, and 1–4 still hold.
  ============================================================
-->
<style>
  :root{ --ink:#E8EAF0; --mid:#0B0F1A; --card:#1C2030; --line:#2E3448; --blue:#5B8AFF; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--mid);color:var(--ink);
       font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif}

  /* ── a real scroll-driven band, so the interaction is tested in context ── */
  .spacer{height:var(--band-open,300px)}
  .band{position:fixed;top:0;left:0;right:0;z-index:10;overflow:hidden;
        height:calc(300px - 200px * var(--p,0));
        background:linear-gradient(180deg,#1b2440,#0B0F1A);
        border-radius:0 0 44px 44px}
  .band .mw{position:absolute;left:0;right:0;text-align:center;
            top:calc(24px - 8px*var(--p,0));font-size:13px;letter-spacing:2px;
            text-transform:uppercase;color:#8B97B8}
  .band .clock{position:absolute;left:0;right:0;text-align:center;
               top:calc(56px - 20px*var(--p,0));color:#F5C518;font-weight:800;
               font-variant-numeric:tabular-nums;
               font-size:calc(38px - 18px*var(--p,0))}
  .band .face{position:absolute;border-radius:50%;background:var(--blue);
              width:calc(64px - 32px*var(--p,0));height:calc(64px - 32px*var(--p,0));
              top:calc(150px - 118px*var(--p,0))}
  .band .fl{left:calc(28px - 14px*var(--p,0))} .band .fr{right:calc(28px - 14px*var(--p,0))}

  .page{padding:16px 16px 120px}
  .row{background:var(--card);border:1px solid var(--line);border-radius:14px;
       padding:14px;margin-bottom:10px}

  /* ── the FAB ── */
  .fab{position:fixed;right:16px;z-index:20;width:56px;height:56px;border:none;
       border-radius:50%;background:var(--blue);color:#fff;font-size:22px;cursor:pointer;
       bottom:calc(16px + env(safe-area-inset-bottom));
       box-shadow:0 8px 22px rgba(0,0,0,.45)}

  /* ── the sheet ──
     ⚠ It covers the VISUAL viewport, not the layout viewport. `bottom: 0` is
     the bottom of the LAYOUT viewport, which on iOS sits underneath the
     keyboard — which is exactly why people reach for the body-fixed hack. The
     height and offset come from visualViewport instead. */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;display:none}
  .sheet{position:fixed;left:0;right:0;top:0;z-index:31;display:none;
         flex-direction:column;justify-content:flex-end;pointer-events:none}
  .sheet.open,.scrim.open{display:flex}
  .panel{pointer-events:auto;background:var(--card);border-top:1px solid var(--line);
         border-radius:20px 20px 0 0;display:flex;flex-direction:column;
         max-height:100%;min-height:60%}
  .panel h2{margin:0;padding:14px 16px;font-size:13px;letter-spacing:1.5px;
            text-transform:uppercase;color:#8B97B8;border-bottom:1px solid var(--line)}
  .list{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 16px}
  .msg{background:#232840;border-radius:12px;padding:9px 12px;margin-bottom:8px;font-size:14px}
  .composer{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));
            border-top:1px solid var(--line);background:var(--card)}
  .composer input{flex:1;min-width:0;background:#0F1420;border:1px solid var(--line);
                  color:var(--ink);border-radius:999px;padding:11px 14px;font-size:16px}
  .composer button{border:none;background:var(--blue);color:#fff;border-radius:999px;
                   padding:0 18px;font-weight:700;cursor:pointer}

  /* ── live readout ── */
  .mode{position:fixed;right:16px;z-index:41;border:none;border-radius:999px;
        bottom:calc(84px + env(safe-area-inset-bottom));
        background:#F5C518;color:#0B0F1A;font:700 11px/1 ui-monospace,monospace;
        padding:9px 12px;cursor:pointer}
  .hud{position:fixed;left:8px;bottom:8px;z-index:40;background:rgba(0,0,0,.82);
       color:#9FE8A0;font:11px/1.45 ui-monospace,Menlo,monospace;padding:8px 10px;
       border-radius:8px;white-space:pre;pointer-events:none}
  .hud b{color:#F5C518}
</style>
</head>
<body>

<div class="band" id="band">
  <div class="mw">Matchweek 3</div>
  <div class="clock" id="clock">30:00:00</div>
  <div class="face fl"></div><div class="face fr"></div>
</div>
<div class="spacer"></div>

<div class="page" id="page"></div>

<button class="fab" id="fab" aria-label="Open banter">💬</button>
<button class="mode" id="mode" aria-label="Cycle sheet placement">MODE</button>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Banter">
  <div class="panel">
    <h2>Banter — prototype</h2>
    <div class="list" id="list"></div>
    <form class="composer" id="composer">
      <input id="input" placeholder="Say something…" autocomplete="off">
      <button type="submit">Send</button>
    </form>
  </div>
</div>

<div class="hud" id="hud">measuring…</div>

<script>
(function () {
  var band = document.getElementById('band'), page = document.getElementById('page')
  var sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim')
  var list = document.getElementById('list'), input = document.getElementById('input')
  var hud = document.getElementById('hud'), clock = document.getElementById('clock')

  for (var i = 1; i <= 30; i++) {
    var r = document.createElement('div'); r.className = 'row'
    r.textContent = 'Page content row ' + i + ' — scroll me, then open the sheet.'
    page.appendChild(r)
  }
  for (var j = 1; j <= 25; j++) {
    var m = document.createElement('div'); m.className = 'msg'
    m.textContent = 'Message ' + j + ' — the list must still scroll with the keyboard up.'
    list.appendChild(m)
  }
  list.scrollTop = list.scrollHeight

  /* the band's collapse, driven by scrollY — the thing body-fixed would kill */
  var TRAVEL = 200
  function onScroll () {
    band.style.setProperty('--p', Math.min(1, Math.max(0, scrollY / TRAVEL)).toFixed(3))
  }
  addEventListener('scroll', onScroll, { passive: true }); onScroll()

  var t = 30 * 3600
  setInterval(function () {
    t--
    var h = String(Math.floor(t / 3600)).padStart(2, '0')
    var m2 = String(Math.floor((t % 3600) / 60)).padStart(2, '0')
    var s = String(t % 60).padStart(2, '0')
    clock.textContent = h + ':' + m2 + ':' + s
  }, 1000)

  /* ── THE ACTUAL EXPERIMENT ────────────────────────────────
     The sheet is sized and positioned from visualViewport, so it tracks the
     area the keyboard leaves behind. NOTHING touches document.body. */
  /* ⚠ THREE CANDIDATE PLACEMENTS, because the first device test could not tell
     them apart. iOS reported `offsetTop 347` — the visual viewport is the LOWER
     slice of the page, not a shorter one — and `position: fixed` may already be
     shifted by that on iOS. If it is, translating by offsetTop double-counts and
     the sheet floats above the keyboard with page content showing beneath it,
     which is exactly what the first run looked like.
     Tap MODE to cycle. Whichever puts the composer ON the keyboard wins. */
  var MODES = ['none', 'transform', 'top']   // 'none' won on device, 2026-09-01
  var mode = 0
  var vv = window.visualViewport
  function fit () {
    if (!vv) {                                  // no support: fall back to the layout viewport
      sheet.style.height = window.innerHeight + 'px'
      sheet.style.transform = 'none'; sheet.style.top = '0px'
      return
    }
    sheet.style.height = vv.height + 'px'
    if (MODES[mode] === 'transform') {          // what the first test ran
      sheet.style.top = '0px'
      sheet.style.transform = 'translateY(' + vv.offsetTop + 'px)'
    } else if (MODES[mode] === 'top') {         // place it, do not move it
      sheet.style.top = vv.offsetTop + 'px'
      sheet.style.transform = 'none'
    } else {                                    // trust fixed to have shifted already
      sheet.style.top = '0px'
      sheet.style.transform = 'none'
    }
  }
  if (vv) { vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit) }
  addEventListener('resize', fit)
  fit()

  function open () { sheet.classList.add('open'); scrim.classList.add('open'); fit()
                     list.scrollTop = list.scrollHeight }
  function close () { sheet.classList.remove('open'); scrim.classList.remove('open'); input.blur() }
  document.getElementById('fab').addEventListener('click', open)
  document.getElementById('mode').addEventListener('click', function () {
    mode = (mode + 1) % MODES.length; fit()
  })
  scrim.addEventListener('click', close)
  addEventListener('keydown', function (e) { if (e.key === 'Escape') close() })

  document.getElementById('composer').addEventListener('submit', function (e) {
    e.preventDefault()
    if (!input.value.trim()) return
    var m = document.createElement('div'); m.className = 'msg'; m.textContent = input.value
    list.appendChild(m); input.value = ''; list.scrollTop = list.scrollHeight
  })

  /* readout — the numbers are the deliverable as much as the feel */
  function hudTick () {
    var open = sheet.classList.contains('open')
    hud.innerHTML =
      'scrollY        <b>' + Math.round(scrollY) + '</b>  (must still move)\n' +
      'band --p       ' + (band.style.getPropertyValue('--p') || '0') + '\n' +
      'innerHeight    ' + window.innerHeight + '\n' +
      'visualViewport ' + (vv ? Math.round(vv.height) + '  offsetTop ' + Math.round(vv.offsetTop)
                              : 'UNSUPPORTED') + '\n' +
      'keyboard       <b>' + (vv ? Math.max(0, Math.round(window.innerHeight - vv.height)) : '?') + '</b>px\n' +
      'body.position  <b>' + (document.body.style.position || 'static') + '</b>  (must stay static)\n' +
      'sheet          ' + (open ? 'OPEN' : 'closed') + '\n' +
      'placement      <b>' + MODES[mode] + '</b>  (tap MODE to cycle)'
    requestAnimationFrame(hudTick)
  }
  hudTick()
})()
</script>
</body>
</html>
